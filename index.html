<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silly Rankings — Oficjalny System Dywizji</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap');
        body { background-color: #030407; color: #f8fafc; font-family: 'Outfit', sans-serif; }
        .glass-card { background: rgba(13, 17, 28, 0.75); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .tier-ht1 { background: #991b1b; color: #fca5a5; } .tier-lt1 { background: #c2410c; color: #fdba74; }
        .tier-ht2 { background: #b45309; color: #fde047; } .tier-lt2 { background: #52525b; color: #e4e4e7; }
        .tier-ht3 { background: #166534; color: #86efac; } .tier-lt3 { background: #047857; color: #6ee7b7; }
        .tier-ht4 { background: #1d4ed8; color: #93c5fd; } .tier-lt4 { background: #1e40af; color: #bfdbfe; }
        .tier-ht5 { background: #581c87; color: #d8b4fe; } .tier-lt5 { background: #6d28d9; color: #c4b5fd; }
    </style>
</head>
<body class="p-6">

    <!-- Baner Discord -->
    <div class="max-w-4xl mx-auto mb-6 glass-card rounded-2xl p-4 text-center border border-purple-500/30 flex flex-col md:flex-row items-center justify-center gap-4">
        <span class="bg-purple-600 text-white text-[10px] font-black px-2 py-1 rounded-md uppercase">Discord</span>
        <p class="text-xs text-slate-300">Chcesz się znaleźć na tabeli? Wbijaj na serwer DC i bądź sprawdzony!</p>
        <a href="https://discord.gg/ShcxZ4Cv9" target="_blank" class="bg-indigo-600 text-white text-xs font-bold px-4 py-2 rounded-lg">Dołącz teraz</a>
    </div>

    <div class="max-w-4xl mx-auto glass-card rounded-3xl p-8">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-black text-white">Ranking Graczy</h1>
            <button onclick="toggleAdmin()" class="text-xs text-slate-400">Admin</button>
        </div>

        <input type="text" id="searchInput" onkeyup="render()" placeholder="Szukaj..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 mb-4">
        
        <table class="w-full text-left">
            <thead><tr class="text-slate-500 text-xs uppercase">
                <th class="p-4">Pozycja</th><th class="p-4">Gracz</th><th class="p-4">Dywizja</th><th class="p-4 text-right">ELO</th>
            </tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <!-- Panel Admina -->
    <div id="adminPanel" class="hidden max-w-4xl mx-auto mt-6 glass-card rounded-3xl p-8">
        <h2 class="font-bold mb-4">Zarządzaj graczami</h2>
        <div class="grid grid-cols-2 gap-4">
            <input id="pName" placeholder="Nick" class="bg-slate-900 p-2 rounded">
            <select id="pTier" class="bg-slate-900 p-2 rounded">
                <option>HT1</option><option>LT1</option><option>HT2</option><option>LT2</option>
                <option>HT3</option><option>LT3</option><option>HT4</option><option>LT4</option>
                <option>HT5</option><option>LT5</option>
            </select>
            <input id="pElo" type="number" placeholder="ELO" class="bg-slate-900 p-2 rounded">
            <button onclick="addPlayer()" class="bg-purple-600 rounded">Dodaj</button>
        </div>
    </div>

    <script>
        let players = JSON.parse(localStorage.getItem('players')) || [
            { name: "Connornonor", tier: "HT3", elo: 2700 },
            { name: "Mloddy_", tier: "LT1", elo: 2500 },
            { name: "Tchomad", tier: "LT2", elo: 2400 },
            { name: "Dymoty", tier: "LT3", elo: 2100 },
            { name: "ximixemx", tier: "LT4", elo: 1500 },
            { name: "franczesco4", tier: "LT5", elo: 900 }
        ];

        function render() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const body = document.getElementById('tableBody');
            body.innerHTML = '';
            players.sort((a,b) => b.elo - a.elo);
            players.forEach((p, i) => {
                if(p.name.toLowerCase().includes(query)) {
                    body.innerHTML += `<tr class="border-t border-slate-800">
                        <td class="p-4 text-purple-400 font-bold">#${i+1}</td>
                        <td class="p-4 font-bold">${p.name}</td>
                        <td class="p-4"><span class="tier-${p.tier.toLowerCase()} px-2 py-1 rounded text-[10px] font-black">${p.tier}</span></td>
                        <td class="p-4 text-right">${p.elo}</td>
                    </tr>`;
                }
            });
            localStorage.setItem('players', JSON.stringify(players));
        }

        function addPlayer() {
            players.push({name: document.getElementById('pName').value, tier: document.getElementById('pTier').value, elo: parseInt(document.getElementById('pElo').value)});
            render();
        }

        function toggleAdmin() { document.getElementById('adminPanel').classList.toggle('hidden'); }

        render();
    </script>
</body>
</html>
