<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silly Rankings — Oficjalny System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');
        body { background-color: #030407; color: #f8fafc; font-family: 'Outfit', sans-serif; }
        .glass { background: rgba(13, 17, 28, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.05); }
        .tier-ht1 { background: #991b1b; color: #fca5a5; } .tier-lt1 { background: #c2410c; color: #fdba74; }
        .tier-ht2 { background: #b45309; color: #fde047; } .tier-lt2 { background: #52525b; color: #e4e4e7; }
        .tier-ht3 { background: #166534; color: #86efac; } .tier-lt3 { background: #047857; color: #6ee7b7; }
        .tier-ht4 { background: #1d4ed8; color: #93c5fd; } .tier-lt4 { background: #1e40af; color: #bfdbfe; }
        .tier-ht5 { background: #581c87; color: #d8b4fe; } .tier-lt5 { background: #6d28d9; color: #c4b5fd; }
    </style>
</head>
<body class="p-6 md:p-12">

    <!-- Baner Discord -->
    <div class="max-w-4xl mx-auto mb-8 glass rounded-2xl p-4 flex items-center justify-center gap-4 text-center border-purple-500/20">
        <span class="bg-purple-600 text-[10px] px-2 py-1 rounded font-black uppercase">Discord</span>
        <p class="text-xs font-medium text-slate-300">Chcesz się znaleźć na tabeli? Wbijaj na serwer DC i bądź sprawdzony!</p>
        <a href="https://discord.gg/ShcxZ4Cv9" target="_blank" class="bg-indigo-600 hover:bg-indigo-500 text-[10px] font-bold px-4 py-1.5 rounded-lg transition-all">Dołącz teraz</a>
    </div>

    <div class="max-w-4xl mx-auto glass rounded-3xl p-8">
        <h1 class="text-3xl font-black mb-2">Silly Rankings</h1>
        <p class="text-slate-400 text-sm mb-8">Oficjalna tablica wyników i dywizji</p>

        <input type="text" id="search" onkeyup="render()" placeholder="Szukaj gracza..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-5 py-3 mb-6 outline-none focus:border-purple-500">
        
        <div id="tableBody" class="space-y-3"></div>
    </div>

    <script>
        let p = [
            {n: "ItzAgg", t: "HT1", e: 3200}, {n: "Carbstuk", t: "HT2", e: 2850},
            {n: "Connornonor", t: "HT3", e: 2710}, {n: "Mloddy_", t: "LT1", e: 2550},
            {n: "Tchomad", t: "LT2", e: 2450}, {n: "Dymoty", t: "LT3", e: 2100},
            {n: "ximixemx", t: "LT4", e: 1500}, {n: "franczesco4", t: "LT5", e: 900}
        ];

        function render() {
            let q = document.getElementById('search').value.toLowerCase();
            let b = document.getElementById('tableBody');
            b.innerHTML = '';
            
            p.sort((a,b) => b.e - a.e).forEach((x, i) => {
                if(x.n.toLowerCase().includes(q)) {
                    b.innerHTML += `
                    <div class="glass p-4 rounded-2xl flex items-center justify-between group hover:border-purple-500/50 transition-all">
                        <div class="flex items-center gap-4">
                            <span class="text-purple-500 font-black w-8">#${i+1}</span>
                            <img src="https://minotar.net/avatar/${x.n}/32.png" class="rounded-lg shadow-lg">
                            <div>
                                <div class="font-bold text-lg">${x.n}</div>
                                <div class="text-[10px] text-slate-500 uppercase tracking-widest">Witaj, ${x.n}! Twój rekord: ${x.e} ELO</div>
                            </div>
                        </div>
                        <div class="flex items-center gap-6">
                            <span class="tier-${x.t.toLowerCase()} px-3 py-1 rounded-lg text-[10px] font-black uppercase">${x.t}</span>
                            <a href="https://namemc.com/search?q=${x.n}" target="_blank" class="text-[10px] underline text-slate-500 hover:text-white">Profil NameMC</a>
                        </div>
                    </div>`;
                }
            });
        }
        render();
    </script>
</body>
</html>
