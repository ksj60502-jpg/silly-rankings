<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Silly Rankings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: radial-gradient(circle at 50% 50%, #0a0b14 0%, #030407 100%); color: white; font-family: sans-serif; }
        .glass { background: rgba(13, 17, 28, 0.7); border: 1px solid #1e293b; border-radius: 1rem; }
        .tier-ht1 { background: #b91c1c; } .tier-ht2 { background: #d97706; }
        .tier-ht3 { background: #15803d; } .tier-lt1 { background: #ea580c; }
        .tier-lt2 { background: #4b5563; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-5xl mx-auto space-y-6">
        <!-- HEADER -->
        <div class="glass p-6 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="bg-purple-600 p-4 rounded-xl font-bold text-xl">SR</div>
                <div>
                    <h1 class="text-2xl font-bold">Silly Rankings</h1>
                    <p class="text-gray-400 text-sm">Oficjalna tablica wyników i dywizji Minecraft</p>
                </div>
            </div>
            <div class="bg-black p-1 rounded-xl border border-gray-800">
                <button class="px-6 py-2 rounded-lg bg-purple-600 text-sm font-bold">Widok Gracza</button>
            </div>
        </div>

        <!-- STATYSTYKI -->
        <div class="grid grid-cols-3 gap-6">
            <div class="glass p-6"><div class="text-gray-500 text-xs uppercase font-bold">Liczba graczy</div><div class="text-2xl font-bold mt-1">8</div></div>
            <div class="glass p-6"><div class="text-gray-500 text-xs uppercase font-bold">Średnie ELO</div><div class="text-2xl font-bold mt-1">2283</div></div>
            <div class="glass p-6"><div class="text-gray-500 text-xs uppercase font-bold">Top 1 gracza</div><div class="text-2xl font-bold mt-1">ItzAgg</div></div>
        </div>

        <!-- RANKING -->
        <div class="glass p-8">
            <h2 class="text-xl font-bold mb-2">Ranking Graczy</h2>
            <p class="text-gray-400 text-sm mb-6">Kliknij w wiersz gracza, aby zobaczyć jego profil, pozycję i skin.</p>
            <input type="text" id="search" onkeyup="render()" placeholder="Szukaj gracza..." class="w-full bg-black border border-gray-800 rounded-xl px-4 py-3 mb-6 outline-none focus:border-purple-500">
            
            <div class="grid grid-cols-4 text-gray-500 text-xs uppercase font-bold px-4 mb-4">
                <div>Pozycja</div><div>Gracz</div><div>Dywizja</div><div class="text-right">Punkty ELO</div>
            </div>
            <div id="tableBody" class="space-y-2"></div>
        </div>
    </div>

    <script>
        let players = [
            {n: "ItzAgg", t: "HT1", e: 3200}, {n: "Carbstuk", t: "HT2", e: 2850},
            {n: "Connornonor", t: "HT3", e: 2710}, {n: "Mloddy_", t: "LT1", e: 2550},
            {n: "Tchomad", t: "LT2", e: 2450}
        ];

        function render() {
            let q = document.getElementById('search').value.toLowerCase();
            let b = document.getElementById('tableBody');
            b.innerHTML = '';
            players.sort((a,b) => b.e - a.e).forEach((p, i) => {
                if(p.n.toLowerCase().includes(q)) {
                    b.innerHTML += `
                    <div class="bg-black/40 p-4 rounded-xl grid grid-cols-4 items-center border border-gray-800 hover:border-purple-500 transition">
                        <div class="font-bold">#${i+1}</div>
                        <div class="font-bold flex items-center gap-3"><img src="https://minotar.net/avatar/${p.n}/30.png" class="rounded"> ${p.n}</div>
                        <div><span class="tier-${p.t.toLowerCase()} text-[10px] font-bold px-3 py-1 rounded">${p.t}</span></div>
                        <div class="text-right font-bold">${p.e} ELO</div>
                    </div>`;
                }
            });
        }
        render();
    </script>
</body>
</html>
