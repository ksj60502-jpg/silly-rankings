<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Silly Rankings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #030407; color: white; font-family: sans-serif; }
        .bg-card { background-color: #0d111c; border: 1px solid #1e293b; }
        .tier-ht1 { background-color: #b91c1c; }
        .tier-ht2 { background-color: #d97706; }
        .tier-ht3 { background-color: #15803d; }
        .tier-lt1 { background-color: #ea580c; }
        .tier-lt2 { background-color: #4b5563; }
        .tier-lt3 { background-color: #059669; }
        .tier-lt4 { background-color: #3b82f6; }
        .tier-lt5 { background-color: #7c3aed; }
    </style>
</head>
<body class="p-4 md:p-10">

    <!-- BANER DISCORD -->
    <div class="max-w-5xl mx-auto mb-6 bg-card rounded-xl p-4 flex items-center justify-center gap-4">
        <span class="bg-[#5865F2] text-xs font-bold px-2 py-1 rounded">DISCORD</span>
        <span class="text-sm">Chcesz się znaleźć na tabeli? Wbijaj na serwer DC i bądź sprawdzony!</span>
        <a href="https://discord.gg/ShcxZ4Cv9" target="_blank" class="bg-white text-black text-xs font-bold px-4 py-1.5 rounded-full hover:bg-gray-200">Dołącz teraz</a>
    </div>

    <div class="max-w-5xl mx-auto bg-card rounded-2xl p-8">
        <!-- HEADER -->
        <div class="flex justify-between items-center mb-10">
            <div class="flex items-center gap-4">
                <div class="bg-purple-600 w-12 h-12 rounded-xl flex items-center justify-center font-bold text-xl">SR</div>
                <div>
                    <h1 class="text-2xl font-bold">Silly Rankings</h1>
                    <p class="text-gray-400 text-sm">Oficjalna tablica wyników i dywizji</p>
                </div>
            </div>
            <div class="bg-[#030407] p-1 rounded-xl border border-gray-800">
                <button onclick="showView('rank')" id="btnRank" class="px-6 py-2 rounded-lg bg-purple-600 text-sm font-bold">Widok Gracza</button>
                <button onclick="showView('admin')" id="btnAdmin" class="px-6 py-2 rounded-lg text-gray-400 text-sm font-bold">Panel Admina</button>
            </div>
        </div>

        <!-- WIDOK RANKINGU -->
        <div id="viewRank">
            <input type="text" id="search" onkeyup="render()" placeholder="Szukaj gracza..." class="w-full bg-[#030407] border border-gray-800 rounded-xl px-5 py-3 mb-6 outline-none focus:border-purple-500">
            <div class="grid grid-cols-4 text-gray-500 text-xs uppercase font-bold px-4 mb-4">
                <div>Pozycja</div><div>Gracz</div><div>Dywizja</div><div class="text-right">ELO</div>
            </div>
            <div id="tableBody" class="space-y-2"></div>
        </div>

        <!-- WIDOK ADMINA -->
        <div id="viewAdmin" class="hidden">
            <div class="grid grid-cols-3 gap-4 mb-8">
                <input id="inN" placeholder="Nick" class="bg-[#030407] p-3 rounded-xl border border-gray-800">
                <select id="inT" class="bg-[#030407] p-3 rounded-xl border border-gray-800">
                    <option>HT1</option><option>HT2</option><option>HT3</option>
                    <option>LT1</option><option>LT2</option><option>LT3</option><option>LT4</option><option>LT5</option>
                </select>
                <input id="inE" type="number" placeholder="ELO" class="bg-[#030407] p-3 rounded-xl border border-gray-800">
                <button onclick="add()" class="col-span-3 bg-purple-600 py-3 rounded-xl font-bold">Dodaj gracza</button>
            </div>
        </div>
    </div>

    <script>
        let players = JSON.parse(localStorage.getItem('data')) || [
            {n: "ItzAgg", t: "HT1", e: 3200}, {n: "Carbstuk", t: "HT2", e: 2850},
            {n: "Connornonor", t: "HT3", e: 2710}, {n: "Mloddy_", t: "LT1", e: 2550},
            {n: "Tchomad", t: "LT2", e: 2450}, {n: "Dymoty", t: "LT3", e: 2100},
            {n: "ximixemx", t: "LT4", e: 1500}, {n: "franczesco4", t: "LT5", e: 900}
        ];

        function render() {
            let q = document.getElementById('search').value.toLowerCase();
            let b = document.getElementById('tableBody');
            b.innerHTML = '';
            players.sort((a,b) => b.e - a.e);
            players.forEach((p, i) => {
                if(p.n.toLowerCase().includes(q)) {
                    b.innerHTML += `
                    <div class="bg-[#030407] p-4 rounded-xl grid grid-cols-4 items-center">
                        <div class="text-purple-500 font-bold">#${i+1}</div>
                        <div class="font-bold flex items-center gap-3">
                            <img src="https://minotar.net/avatar/${p.n}/30.png" class="rounded"> ${p.n}
                        </div>
                        <div><span class="tier-${p.t.toLowerCase()} text-[10px] font-bold px-2 py-1 rounded">${p.t}</span></div>
                        <div class="text-right">${p.e}</div>
                    </div>`;
                }
            });
            localStorage.setItem('data', JSON.stringify(players));
        }

        function add() {
            players.push({n: document.getElementById('inN').value, t: document.getElementById('inT').value, e: parseInt(document.getElementById('inE').value)});
            render();
        }

        function showView(v) {
            document.getElementById('viewRank').classList.toggle('hidden', v !== 'rank');
            document.getElementById('viewAdmin').classList.toggle('hidden', v !== 'admin');
            document.getElementById('btnRank').classList.toggle('bg-purple-600', v === 'rank');
            document.getElementById('btnAdmin').classList.toggle('bg-purple-600', v === 'admin');
        }

        render();
    </script>
</body>
</html>
