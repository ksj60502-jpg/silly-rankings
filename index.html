<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silly Rankings — Oficjalny System Dywizji</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap');
        
        body {
            background-color: #030407;
            color: #f8fafc;
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(13, 17, 28, 0.75);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body class="pb-16">

    <!-- Nagłówek -->
    <header class="w-full max-w-6xl mx-auto px-6 pt-10 space-y-4">
        
        <!-- Główny pasek -->
        <div class="glass-card rounded-3xl p-6 md:px-10 flex flex-col sm:flex-row justify-between items-center gap-6">
            <div class="flex items-center space-x-4">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center shadow-xl">
                    <span class="text-2xl font-black">SR</span>
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-white to-purple-300">Silly Rankings</h1>
                    <p class="text-sm text-slate-400 font-medium">Oficjalna tablica wyników i dywizji Minecraft</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-3 bg-slate-950/80 p-2 rounded-2xl border border-slate-800">
                <button onclick="switchView('viewer')" id="btnViewer" class="px-6 py-3 text-sm font-bold rounded-xl bg-purple-600 text-white shadow-lg transition-all">Widok Gracza</button>
                <button onclick="showLoginModal()" id="btnAdmin" class="px-6 py-3 text-sm font-bold rounded-xl text-slate-400 hover:text-white transition-all">Panel Admina</button>
            </div>
        </div>

        <!-- Sekcja Discorda -->
        <div class="glass-card rounded-2xl p-6 border-indigo-500/30 text-center">
            <p class="text-sm text-indigo-100 font-medium mb-4">
                Chcesz znaleźć się na tabeli? Dołącz do Discorda i bądź sprawdzony!
            </p>
            <a href="https://discord.gg/kfp7Gm8r8" target="_blank" class="inline-block px-8 py-3 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-xl transition-all shadow-lg shadow-indigo-600/20 uppercase tracking-widest">
                Dołącz do Discorda
            </a>
        </div>
    </header>

    <!-- Główna zawartość -->
    <main class="w-full max-w-6xl mx-auto px-6 mt-8">
        <div id="viewerView" class="glass-card rounded-3xl p-8">
            <h2 class="text-xl font-bold mb-4">Ranking graczy</h2>
            <div id="playerTableBody" class="text-slate-400">Tutaj pojawi się tabela wyników...</div>
        </div>
        
        <div id="adminView" class="hidden glass-card rounded-3xl p-8">
            <h2 class="text-xl font-bold mb-4 text-purple-400">Panel zarządzania</h2>
            <!-- Tutaj będzie reszta panelu -->
        </div>
    </main>

    <script>
        function switchView(view) {
            document.getElementById('viewerView').classList.toggle('hidden', view !== 'viewer');
            document.getElementById('adminView').classList.toggle('hidden', view !== 'admin');
        }
        function showLoginModal() {
            alert("Funkcja logowania admina");
        }
    </script>
</body>
</html>
