<script>
        // Ukryte hasło zakodowane w Base64 (TWluZWNyYWZ0MjAyMCE/IQ== to "Minecraft2020!?!")
        const CORRECT_PASSWORD_HASH = "TWluZWNyYWZ0MjAyMCE/IQ==";

        function togglePasswordVisibility() {
            const input = document.getElementById("adminPasswordInput");
            const btn = document.querySelector(".toggle-password-btn");
            if (input.type === "password") {
                input.type = "text";
                btn.textContent = "🙈";
            } else {
                input.type = "password";
                btn.textContent = "👁️";
            }
        }

        function checkAuthState() {
            const isAuthenticated = sessionStorage.getItem("silly_admin_auth") === "true";
            if (isAuthenticated) {
                document.getElementById("adminLoginArea").style.display = "none";
                document.getElementById("adminContentArea").style.display = "block";
            } else {
                document.getElementById("adminLoginArea").style.display = "block";
                document.getElementById("adminContentArea").style.display = "none";
            }
        }

        function checkAdminPassword() {
            const inputVal = document.getElementById("adminPasswordInput").value;
            const errorDiv = document.getElementById("loginError");

            // Zamiana wpisanego tekstu na format Base64 w celu ukrycia
            const inputHash = btoa(inputVal);

            if (inputHash === CORRECT_PASSWORD_HASH) {
                sessionStorage.setItem("silly_admin_auth", "true");
                errorDiv.style.display = "none";
                document.getElementById("adminPasswordInput").value = "";
                checkAuthState();
                renderAdminTable();
            } else {
                errorDiv.style.display = "block";
            }
        }

        function adminLogout() {
            sessionStorage.removeItem("silly_admin_auth");
            checkAuthState();
        }

        const defaultPlayers = [
            { id: "p1", nick: "Technoblade", tierClass: "tier-ht1", tierName: "HT1 (High Tier 1)", elo: 3200 },
            { id: "p2", nick: "Steve", tierClass: "tier-lt1", tierName: "LT1 (Low Tier 1)", elo: 2850 },
            { id: "p3", nick: "Alex", tierClass: "tier-ht2", tierName: "HT2 (High Tier 2)", elo: 2710 },
            { id: "p4", nick: "Notch", tierClass: "tier-lt3", tierName: "LT3 (Low Tier 3)", elo: 2450 },
            { id: "p5", nick: "Dream", tierClass: "tier-lt4", tierName: "LT4 (Low Tier 4)", elo: 2100 }
        ];

        const STORAGE_KEY = 'silly_rankings_players_v4';
        const syncChannel = new BroadcastChannel('silly_rankings_channel');

        let players = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultPlayers;

        function saveAndSync() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(players));
            syncChannel.postMessage({ type: 'UPDATE', data: players });
            renderAllViews();
        }

        syncChannel.onmessage = (event) => {
            if (event.data && event.data.type === 'UPDATE') {
                players = event.data.data;
                renderAllViews();
            }
        };

        window.addEventListener('storage', (e) => {
            if (e.key === STORAGE_KEY) {
                players = JSON.parse(e.newValue) || [];
                renderAllViews();
            }
        });

        function switchView(viewId, btnElement) {
            document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(viewId).classList.add('active');
            btnElement.classList.add('active');

            renderAllViews();
        }

        function renderAllViews() {
            renderAdminTable();
            renderViewerTable();
        }

        function renderAdminTable() {
            const tbody = document.getElementById("adminTableBody");
            if (!tbody) return;

            const filter = document.getElementById("adminSearchInput") ? document.getElementById("adminSearchInput").value.toUpperCase() : "";
            tbody.innerHTML = "";

            const sortedPlayers = [...players].sort((a, b) => b.elo - a.elo);

            let visibleIndex = 1;
            sortedPlayers.forEach((player) => {
                if (player.nick.toUpperCase().includes(filter)) {
                    const tr = document.createElement("tr");

                    let rankClass = "";
                    if (visibleIndex === 1) rankClass = "rank-1";
                    else if (visibleIndex === 2) rankClass = "rank-2";
                    else if (visibleIndex === 3) rankClass = "rank-3";

                    tr.innerHTML = `
                        <td class="rank ${rankClass}">#${visibleIndex}</td>
                        <td class="player">
                            <img src="https://minotar.net/helm/${player.nick}/36.png" onerror="this.src='https://minotar.net/helm/Steve/36.png'" alt="${player.nick}">
                            ${player.nick}
                        </td>
                        <td><span class="badge ${player.tierClass}">${player.tierName}</span></td>
                        <td class="score">${player.elo} ELO</td>
                        <td>
                            <div class="action-btns">
                                <button class="btn btn-edit" onclick="openEditModal('${player.id}')">✏️ Edytuj</button>
                                <button class="btn btn-delete" onclick="deletePlayer('${player.id}')">🗑️ Usuń</button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                    visibleIndex++;
                }
            });

            if (tbody.children.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:20px; color:#94a3b8;">Brak graczy w bazie.</td></tr>`;
            }
        }

        function renderViewerTable() {
            const tbody = document.getElementById("viewerTableBody");
            const filter = document.getElementById("viewerSearchInput") ? document.getElementById("viewerSearchInput").value.toUpperCase() : "";
            tbody.innerHTML = "";

            const sortedPlayers = [...players].sort((a, b) => b.elo - a.elo);

            let visibleIndex = 1;
            sortedPlayers.forEach((player) => {
                if (player.nick.toUpperCase().includes(filter)) {
                    const tr = document.createElement("tr");

                    let rankClass = "";
                    if (visibleIndex === 1) rankClass = "rank-1";
                    else if (visibleIndex === 2) rankClass = "rank-2";
                    else if (visibleIndex === 3) rankClass = "rank-3";

                    tr.innerHTML = `
                        <td class="rank ${rankClass}">#${visibleIndex}</td>
                        <td class="player">
                            <img src="https://minotar.net/helm/${player.nick}/36.png" onerror="this.src='https://minotar.net/helm/Steve/36.png'" alt="${player.nick}">
                            ${player.nick}
                        </td>
                        <td><span class="badge ${player.tierClass}">${player.tierName}</span></td>
                        <td class="score">${player.elo} ELO</td>
                    `;
                    tbody.appendChild(tr);
                    visibleIndex++;
                }
            });

            if (tbody.children.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:20px; color:#94a3b8;">Brak graczy w rankingu.</td></tr>`;
            }
        }

        function addPlayer() {
            const nickInput = document.getElementById("newNick");
            const tierSelect = document.getElementById("newTier");
            const eloInput = document.getElementById("newElo");

            const nick = nickInput.value.trim();
            const [tierClass, tierName] = tierSelect.value.split("|");
            const elo = parseInt(eloInput.value);

            if (!nick) {
                alert("Wprowadź nick gracza!");
                return;
            }

            if (isNaN(elo)) {
                alert("Wprowadź poprawną liczbę punktów ELO!");
                return;
            }

            const newPlayer = {
                id: 'p_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6),
                nick,
                tierClass,
                tierName,
                elo
            };

            players.push(newPlayer);
            saveAndSync();

            nickInput.value = "";
            eloInput.value = "";
        }

        function openEditModal(playerId) {
            const player = players.find(p => p.id === playerId);
            if (!player) return;

            document.getElementById("editIndex").value = player.id;
            document.getElementById("editNick").value = player.nick;
            document.getElementById("editTier").value = `${player.tierClass}|${player.tierName}`;
            document.getElementById("editElo").value = player.elo;

            document.getElementById("editModal").classList.add("active");
        }

        function closeEditModal() {
            document.getElementById("editModal").classList.remove("active");
        }

        function savePlayerEdit() {
            const id = document.getElementById("editIndex").value;
            const nick = document.getElementById("editNick").value.trim();
            const [tierClass, tierName] = document.getElementById("editTier").value.split("|");
            const elo = parseInt(document.getElementById("editElo").value);

            if (!nick || isNaN(elo)) {
                alert("Proszę podać prawidłowy Nick oraz punkty ELO!");
                return;
            }

            const index = players.findIndex(p => p.id === id);
            if (index !== -1) {
                players[index] = { id, nick, tierClass, tierName, elo };
                saveAndSync();
                closeEditModal();
            }
        }

        function deletePlayer(playerId) {
            const player = players.find(p => p.id === playerId);
            if (player && confirm(`Czy na pewno chcesz usunąć gracza "${player.nick}"?`)) {
                players = players.filter(p => p.id !== playerId);
                saveAndSync();
            }
        }

        function clearAllPlayers() {
            if (confirm("Czy na pewno chcesz usunąć WSZYSTKICH graczy z listy?")) {
                players = [];
                saveAndSync();
            }
        }

        checkAuthState();
        renderAllViews();
    </script>
