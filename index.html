<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silly Rankings | Pro System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #030407; color: #fff; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(13, 17, 28, 0.7); backdrop-filter: blur(12px); border: 1px solid #1e293b; }
        .glow { box-shadow: 0 0 20px rgba(168, 85, 247, 0.2); }
        .tier-ht1 { background: #b91c1c; } .tier-ht2 { background: #d97706; }
        .tier-ht3 { background: #15803d; } .tier-lt1 { background: #ea580c; }
        .tier-lt2 { background: #4b5563; } .tier-lt3 { background: #059669; }
        .tier-lt4 { background: #3b82f6; } .tier-lt5 { background: #7c3aed; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">

        <!-- BANER DISCORD -->
        <div class="glass p-4 rounded-xl flex items-center justify-between border-purple-900/30">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-1.5 rounded-lg"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.972.074.074 0 0 0-.041-.104 13.2 13.2 0 0 1-1.872-.897.075.075 0 0 1-.008-.126c.126-.093.252-.19.372-.287a.075.075 0 0 1 .078-.01c3.927 1.79 8.18 1.79 12.061 0a.075.075 0 0 1 .079.009c.12.098.245.194.372.288a.075.075 0 0 1-.006.127 12.23 12.23 0 0 1-1.873.896.074.074 0 0 0-.04.105c.36.69.772 1.353 1.226 1.972a.077.077 0 0 0 .084.027 19.84 19.84 0 0 0 5.993-3.03.077.077 0 0 0 .032-.057c.502-5.327-.852-9.824-3.567-13.66a.073.073 0 0 0-.033-.028zM8.02 15.33c-1.18 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.18 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg></div>
                <p class="text-xs font-medium text-gray-200">Chcesz się znaleźć na tabeli? Wbijaj na serwer DC!</p>
            </div>
            <a href="https://discord.gg/ShcxZ4Cv9" target="_blank" class="bg-indigo-600 hover:bg-indigo-500 text-[10px] font-bold px-4 py-1.5 rounded-lg transition-all">DOŁĄCZ</a>
        </div>

        <!-- HEADER & STATS -->
        <div class="grid md:grid-cols-3 gap-6">
            <div class="md:col-span-2 glass p-8 rounded-2xl glow">
                <h1 class="text-3xl font-black mb-2">Silly Rankings</h1>
                <p class="text-gray-400 text-sm">Oficjalny system dywizji i ranking graczy.</p>
            </div>
            <div class="glass p-6 rounded-2xl flex flex-col justify-center">
                <div class="text-[10px] uppercase text-gray-500 font-bold mb-1">Aktywnych graczy</div>
                <div id="pCount" class="text-2xl font-bold mb-4">0</div>
                <div class="text-[10px] uppercase text-gray-500 font-bold mb-1">Top lider</div>
                <div id="pTop" class="text-purple-400 font-bold">-</div>
            </div>
        </div>

        <!-- TABELA -->
        <div class="glass p-6 rounded-2xl">
            <input type="text" id="search" onkeyup="render()" placeholder="Wyszukaj gracza..." class="w-full bg-slate-950/50 border border-slate-800 rounded-xl px-4 py-3 mb-6 outline-none focus:border-purple-500 transition-all">
            <div id="tableBody" class="space-y-2"></div>
        </div>

    </div>

    <script>
        let p = [
            {n: "ItzAgg", t: "HT1", e: 3200}, {n: "Carbstuk", t: "HT2", e: 2850},
            {n: "Connornonor", t: "HT3", e: 2710}, {n: "Mloddy_", t: "LT1", e: 2550},
            {n: "Tchomad", t: "LT2", e: 2450}, {n: "Dymoty", t: "LT3", e: 2100},
            {n: "ximixemx", t: "LT4", e: 1500}, {n: "franczesco4", t: "LT5", e: 900}
        ];

        function render() {
            let q = document.getElementById('search').value.toLowerCase();
            let b = document.getElementById('tableBody');
            b.innerHTML = '';
            
            p.sort((a,b) => b.e - a.e);
            document.getElementById('pCount').innerText = p.length;
            document.getElementById('pTop').innerText = p[0].n;

            p.forEach((x, i) => {
                if(x.n.toLowerCase().includes(q)) {
                    b.innerHTML += `
                    <div class="flex items-center justify-between p-3 rounded-xl bg-slate-950/30 border border-slate-800/50 hover:border-purple-500/30 transition-all">
                        <div class="flex items-center gap-4">
                            <span class="w-8 font-bold text-purple-500">#${i+1}</span>
                            <img src="https://minotar.net/avatar/${x.n}/32.png" class="rounded shadow-lg">
                            <span class="font-bold">${x.n}</span>
                        </div>
                        <div class="flex items-center gap-6">
                            <span class="tier-${x.t.toLowerCase()} text-[9px] font-black px-2.5 py-1 rounded-full">${x.t}</span>
                            <span class="w-20 text-right font-mono text-sm">${x.e}</span>
                        </div>
                    </div>`;
                }
            });
        }
        render();
    </script>
</body>
</html>
