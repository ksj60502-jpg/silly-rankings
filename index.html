<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silly Rankings — Oficjalny System Dywizji</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap');
        
        body { background-color: #030407; color: #f8fafc; font-family: 'Outfit', sans-serif; overflow-x: hidden; }
        
        /* Tło z gwiazdami */
        .space-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; background: radial-gradient(circle at 50% 20%, #0a0b14 0%, #030407 100%); }
        .star { position: absolute; background: #ffffff; border-radius: 50%; box-shadow: 0 0 10px #fff; animation: fall linear infinite; }
        @keyframes fall { 0% { transform: translateY(-100px); opacity: 0; } 20% { opacity: 0.8; } 100% { transform: translateY(105vh); opacity: 0; } }
        
        .glass-card { background: rgba(13, 17, 28, 0.75); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8); }
        .tier-tag { padding: 4px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; }
    </style>
</head>
<body class="pb-16">

    <div class="space-bg" id="starsContainer"></div>

    <header class="w-full max-w-6xl mx-auto px-6 pt-10 space-y-4">
        <div class="glass-card rounded-3xl p-6 md:px-10 flex flex-col sm:flex-row justify-between items-center gap-6">
            <div class="flex items-center space-x-4">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center font-black text-2xl">SR</div>
                <div>
                    <h1 class="text-2xl font-extrabold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-white to-purple-300">Silly Rankings</h1>
                    <p class="text-xs text-slate-400">Oficjalna tablica wyników Minecraft</p>
                </div>
            </div>
            <!-- Przycisk Discord w nagłówku -->
            <div>
                <a href="https://discord.gg/kfp7Gm8r8" target="_blank" class="px-6 py-3 text-sm font-bold rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white transition-all shadow-lg shadow-indigo-600/30 flex items-center space-x-2">
                    <span>Discord</span>
                </a>
            </div>
        </div>

        <!-- Sekcja Discord (duża ramka) -->
        <div class="glass-card rounded-2xl p-6 border-indigo-500/30 text-center">
            <p class="text-sm text-indigo-100 font-medium mb-4">Chcesz znaleźć się na tabeli? Dołącz do Discorda i bądź sprawdzony!</p>
            <a href="https://discord.gg/kfp7Gm8r8" target="_blank" class="inline-block px-8 py-3 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-xl uppercase tracking-widest transition-all">Dołącz do Discorda</a>
        </div>
    </header>

    <main class="w-full max-w-6xl mx-auto px-6 mt-8">
        <div class="glass-card rounded-3xl p-8">
            <h2 class="text-xl font-bold mb-6">Ranking graczy</h2>
            <table class="w-full text-left">
                <thead>
                    <tr class="text-slate-400 text-xs uppercase border-b border-slate-800">
                        <th class="pb-3">Poz.</th>
                        <th class="pb-3">Gracz</th>
                        <th class="pb-3">Dywizja</th>
                        <th class="pb-3 text-right">ELO</th>
                    </tr>
                </thead>
                <tbody id="playerTableBody"></tbody>
            </table>
        </div>
    </main>

    <script>
        // Logika gwiazd
        const container = document.getElementById('starsContainer');
        for(let i=0; i<30; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            s.style.width = s.style.height = (Math.random()*3+1)+'px';
            s.style.left = Math.random()*100+'vw';
            s.style.animationDuration = (Math.random()*5+5)+'s';
            container.appendChild(s);
        }

        // Logika rankingu
        const players = [
            { name: "ItzAgg", tier: "HT1", elo: 3200 },
            { name: "Carbstuk", tier: "HT2", elo: 2850 }
        ];
        
        const tbody = document.getElementById('playerTableBody');
        tbody.innerHTML = players.map((p, i) => `
            <tr class="border-b border-slate-800/50">
                <td class="py-4 font-bold text-purple-400">#${i+1}</td>
                <td class="py-4 font-semibold">${p.name}</td>
                <td class="py-4"><span class="tier-tag bg-red-900/50 text-red-200">${p.tier}</span></td>
                <td class="py-4 text-right font-mono font-bold text-purple-300">${p.elo}</td>
            </tr>
        `).join('');
    </script>
</body>
</html>
