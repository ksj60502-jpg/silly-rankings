<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silly Rankings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #030407; color: #f8fafc; font-family: sans-serif; }
        .glass { background: rgba(13, 17, 28, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="p-6">

    <!-- Baner Discord (zamiast admina) -->
    <div class="max-w-4xl mx-auto mb-8 glass rounded-2xl p-4 flex items-center justify-center gap-4 text-center border-purple-500/20">
        <span class="bg-purple-600 text-[10px] px-2 py-1 rounded font-black uppercase text-white">Discord</span>
        <p class="text-xs font-medium text-slate-300">Oficjalna społeczność Silly Rankings!</p>
        <a href="https://discord.gg/ShcxZ4Cv9" target="_blank" class="bg-indigo-600 text-white text-[10px] font-bold px-4 py-1.5 rounded-lg">DOŁĄCZ</a>
    </div>

    <!-- Główna zawartość -->
    <div class="max-w-4xl mx-auto glass rounded-3xl p-8">
        <h1 class="text-3xl font-black mb-6 text-center">Oficjalny Ranking Graczy</h1>
        
        <input type="text" id="search" onkeyup="render()" placeholder="Wyszukaj gracza..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-5 py-3 mb-6 outline-none focus:border-purple-500">
        
        <div id="tableBody" class="space-y-3"></div>
    </div>

    <script>
        let p = [
            {n: "ItzAgg", t: "HT1", e: 3200}, {n: "Carbstuk", t: "HT2", e: 2850},
            {n: "Connornonor", t: "HT3", e: 2710}, {n: "Mloddy_", t: "LT1", e: 2550},
            {n: "Tchomad", t: "LT2", e: 2450}, {n: "Dymoty", t: "LT3", e: 2100},
            {n: "ximixemx", t: "LT4", e: 1500}, {n: "franczesco4", t: "LT5", e: 900}
        ];

        function render() {
            let q = document.getElementById('search').value.toLowerCase();
            let b = document.getElementById('tableBody');
            b.innerHTML = '';
            
            p.sort((a,b) => b.e - a.e).forEach((x, i) => {
                if(x.n.toLowerCase().includes(q)) {
                    b.innerHTML += `
                    <div class="glass p-4 rounded-xl flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <span class="text-purple-500 font-bold">#${i+1}</span>
                            <span class="font-bold">${x.n}</span>
                        </div>
                        <div class="flex items-center gap-4">
                            <span class="bg-slate-800 px-3 py-1 rounded text-xs font-bold">${x.t}</span>
                            <span class="text-purple-400 font-bold">${x.e} ELO</span>
                        </div>
                    </div>`;
                }
            });
        }
        render();
    </script>
</body>
</html>
