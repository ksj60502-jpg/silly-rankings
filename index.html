<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silly Rankings - Oficjalny Ranking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f111a;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .tier-ht1 { background-color: #991b1b; color: #fca5a5; }
        .tier-lt1 { background-color: #c2410c; color: #fdba74; }
        .tier-ht2 { background-color: #b45309; color: #fde047; }
        .tier-lt3 { background-color: #047857; color: #6ee7b7; }
        .tier-lt4 { background-color: #1d4ed8; color: #93c5fd; }
        .tier-lt5 { background-color: #6d28d9; color: #c4b5fd; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4">

    <div class="w-full max-w-4xl mx-auto pt-8">
        <!-- Nagłówek i przełącznik widoku -->
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-purple-500">Silly Rankings</h1>
                <p class="text-xs text-slate-400 mt-1">Oficjalna tablica wyników i dywizji.</p>
            </div>
            <div class="space-x-2">
                <button onclick="switchView('viewer')" id="btnViewer" class="px-4 py-2 text-sm font-semibold rounded-lg bg-purple-600 text-white shadow hover:bg-purple-500 transition">Widok Gracza</button>
                <button onclick="switchView('admin')" id="btnAdmin" class="px-4 py-2 text-sm font-semibold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Panel Admina</button>
            </div>
        </div>

        <!-- WIDOK: VIEWER -->
        <div id="viewerView" class="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-xl backdrop-blur">
            <div class="mb-6">
                <input type="text" id="searchInput" onkeyup="filterPlayers()" placeholder="Wyszukaj gracza..." class="w-full bg-slate-800/60 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-purple-500 text-slate-200">
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-800 text-slate-400 text-xs uppercase tracking-wider">
                            <th class="py-3 px-4">Pozycja</th>
                            <th class="py-3 px-4">Gracz</th>
                            <th class="py-3 px-4">Dywizja</th>
                            <th class="py-3 px-4 text-right">Punkty ELO</th>
                        </tr>
                    </thead>
                    <tbody id="playerTableBody" class="divide-y divide-slate-800/50 text-sm">
                        <!-- Generowane dynamicznie -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- WIDOK: ADMIN -->
        <div id="adminView" class="hidden bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-xl backdrop-blur">
            <h2 class="text-xl font-bold mb-4 text-purple-400">Panel Zarządzania (Admin)</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 bg-slate-800/40 p-4 rounded-xl border border-slate-800">
                <input type="text" id="adminName" placeholder="Nick (np. ItzAgg)" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
                <select id="adminTier" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
                    <option value="HT1">HT1 (High Tier 1)</option>
                    <option value="LT1">LT1 (Low Tier 1)</option>
                    <option value="HT2">HT2 (High Tier 2)</option>
                    <option value="LT3">LT3 (Low Tier 3)</option>
                    <option value="LT4">LT4 (Low Tier 4)</option>
                    <option value="LT5">LT5 (Low Tier 5)</option>
                </select>
                <input type="number" id="adminElo" placeholder="Punkty ELO (np. 2500)" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
                <button onclick="addOrUpdatePlayer()" id="saveBtn" class="md:col-span-3 bg-purple-600 hover:bg-purple-500 font-semibold py-2 rounded-lg text-white transition">Dodaj / Zaktualizuj Gracza</button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-800 text-slate-400 text-xs uppercase tracking-wider">
                            <th class="py-3 px-4">#</th>
                            <th class="py-3 px-4">Gracz</th>
                            <th class="py-3 px-4">Dywizja</th>
                            <th class="py-3 px-4">Punkty ELO</th>
                            <th class="py-3 px-4 text-right">Akcje</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody" class="divide-y divide-slate-800/50 text-sm">
                        <!-- Generowane dynamicznie -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <footer class="text-xs text-slate-500 mt-8">
        © 2026 Silly Rankings. Wszystkie prawa zastrzeżone.
    </footer>

    <script>
        // Domyślna lista graczy (wgrana na stałe dla każdego odwiedzającego)
        const defaultPlayers = [
            { name: "ItzAgg", tier: "HT1", elo: 3200 },
            { name: "Carbstuk", tier: "LT1", elo: 2850 },
            { name: "Connornonor", tier: "HT2", elo: 2710 },
            { name: "Tchomad", tier: "LT3", elo: 2450 },
            { name: "Dymoty", tier: "LT4", elo: 2100 },
            { name: "Mloddy_", tier: "LT5", elo: 1300 },
            { name: "ximixemx", tier: "LT5", elo: 800 }
        ];

        let players = JSON.parse(localStorage.getItem('silly_players')) || defaultPlayers;
        let editingIndex = null;

        function saveAndRender() {
            players.sort((a, b) => b.elo - a.elo);
            localStorage.setItem('silly_players', JSON.stringify(players));
            renderTables();
        }

        function renderTables() {
            const viewerBody = document.getElementById('playerTableBody');
            const adminBody = document.getElementById('adminTableBody');
            
            viewerBody.innerHTML = '';
            adminBody.innerHTML = '';

            players.forEach((p, index) => {
                const tierClass = 'tier-' + p.tier.toLowerCase();
                
                // Wiersz Viewera
                viewerBody.innerHTML += `
                    <tr class="hover:bg-slate-800/30 transition">
                        <td class="py-3 px-4 font-bold text-purple-400">#${index + 1}</td>
                        <td class="py-3 px-4 flex items-center space-x-3">
                            <img src="https://minotar.net/avatar/${p.name}/32.png" class="w-8 h-8 rounded" alt="">
                            <span class="font-medium text-white">${p.name}</span>
                        </td>
                        <td class="py-3 px-4"><span class="px-2.5 py-1 rounded-md text-xs font-bold ${tierClass}">${p.tier}</span></td>
                        <td class="py-3 px-4 text-right font-mono text-purple-300">${p.elo} ELO</td>
                    </tr>
                `;

                // Wiersz Admina
                adminBody.innerHTML += `
                    <tr class="hover:bg-slate-800/30 transition">
                        <td class="py-3 px-4 font-bold text-slate-400">#${index + 1}</td>
                        <td class="py-3 px-4 flex items-center space-x-3">
                            <img src="https://minotar.net/avatar/${p.name}/32.png" class="w-8 h-8 rounded" alt="">
                            <span class="font-medium text-white">${p.name}</span>
                        </td>
                        <td class="py-3 px-4"><span class="px-2.5 py-1 rounded-md text-xs font-bold ${tierClass}">${p.tier}</span></td>
                        <td class="py-3 px-4 font-mono text-purple-300">${p.elo} ELO</td>
                        <td class="py-3 px-4 text-right space-x-2">
                            <button onclick="editPlayer(${index})" class="bg-blue-600 hover:bg-blue-500 px-3 py-1 rounded text-xs text-white">Edytuj</button>
                            <button onclick="deletePlayer(${index})" class="bg-red-600 hover:bg-red-500 px-3 py-1 rounded text-xs text-white">Usuń</button>
                        </td>
                    </tr>
                `;
            });
        }

        function switchView(view) {
            const viewer = document.getElementById('viewerView');
            const admin = document.getElementById('adminView');
            const btnV = document.getElementById('btnViewer');
            const btnA = document.getElementById('btnAdmin');

            if (view === 'viewer') {
                viewer.classList.remove('hidden');
                admin.classList.add('hidden');
                btnV.className = "px-4 py-2 text-sm font-semibold rounded-lg bg-purple-600 text-white shadow hover:bg-purple-500 transition";
                btnA.className = "px-4 py-2 text-sm font-semibold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition";
            } else {
                viewer.classList.add('hidden');
                admin.classList.remove('hidden');
                btnA.className = "px-4 py-2 text-sm font-semibold rounded-lg bg-purple-600 text-white shadow hover:bg-purple-500 transition";
                btnV.className = "px-4 py-2 text-sm font-semibold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition";
            }
        }

        function addOrUpdatePlayer() {
            const name = document.getElementById('adminName').value.trim();
            const tier = document.getElementById('adminTier').value;
            const elo = parseInt(document.getElementById('adminElo').value);

            if (!name || isNaN(elo)) {
                alert('Wpisz poprawny nick oraz punkty ELO!');
                return;
            }

            if (editingIndex !== null) {
                players[editingIndex] = { name, tier, elo };
                editingIndex = null;
                document.getElementById('saveBtn').innerText = "Dodaj do Rankingu";
            } else {
                players.push({ name, tier, elo });
            }

            document.getElementById('adminName').value = '';
            document.getElementById('adminElo').value = '';
            saveAndRender();
        }

        function editPlayer(index) {
            const p = players[index];
            document.getElementById('adminName').value = p.name;
            document.getElementById('adminTier').value = p.tier;
            document.getElementById('adminElo').value = p.elo;
            editingIndex = index;
            document.getElementById('saveBtn').innerText = "Zaktualizuj Gracza";
        }

        function deletePlayer(index) {
            if (confirm("Na pewno usunąć tego gracza?")) {
                players.splice(index, 1);
                saveAndRender();
            }
        }

        function filterPlayers() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const rows = document.querySelectorAll('#playerTableBody tr');
            rows.forEach(row => {
                const name = row.querySelector('span.font-medium').innerText.toLowerCase();
                row.style.display = name.includes(query) ? '' : 'none';
            });
        }

        // Pierwsze uruchomienie
        saveAndRender();
    </script>
</body>
</html>
