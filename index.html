<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silly Rankings — Oficjalny System Dywizji</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap');
        body { background-color: #030407; color: #f8fafc; font-family: 'Outfit', sans-serif; }
        .glass-card { background: rgba(13, 17, 28, 0.75); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8); }
        .tier-ht1 { background: #991b1b; color: #fca5a5; padding: 2px 8px; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body class="pb-16">

    <header class="w-full max-w-6xl mx-auto px-6 pt-10 space-y-4">
        <!-- Pasek górny -->
        <div class="glass-card rounded-3xl p-6 flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center font-black text-2xl">SR</div>
                <div>
                    <h1 class="text-xl font-bold">Silly Rankings</h1>
                    <p class="text-xs text-slate-400">Oficjalna tablica wyników i dywizji Minecraft</p>
                </div>
            </div>
            <div class="flex bg-slate-900 p-2 rounded-2xl border border-slate-800">
                <button onclick="switchView('viewer')" class="px-6 py-3 text-sm font-bold rounded-xl bg-purple-600 text-white">Widok Gracza</button>
                <button onclick="switchView('admin')" class="px-6 py-3 text-sm font-bold rounded-xl text-slate-400">Panel Admina</button>
            </div>
        </div>

        <!-- Discord -->
        <div class="glass-card rounded-2xl p-6 border-indigo-500/30 text-center">
            <p class="text-sm text-indigo-100 font-medium mb-4">Chcesz znaleźć się na tabeli? Dołącz do Discorda i bądź sprawdzony!</p>
            <a href="https://discord.gg/kfp7Gm8r8" target="_blank" class="inline-block px-8 py-3 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-xl uppercase">Dołącz do Discorda</a>
        </div>
    </header>

    <main class="w-full max-w-6xl mx-auto px-6 mt-8">
        <!-- Tabela -->
        <div id="viewerView" class="glass-card rounded-3xl p-8">
            <h2 class="text-xl font-bold mb-4">Ranking graczy</h2>
            <table class="w-full text-left">
                <thead>
                    <tr class="text-slate-400 text-xs uppercase border-b border-slate-800">
                        <th class="pb-3">Pozycja</th>
                        <th class="pb-3">Gracz</th>
                        <th class="pb-3">Dywizja</th>
                        <th class="pb-3 text-right">ELO</th>
                    </tr>
                </thead>
                <tbody id="playerTableBody"></tbody>
            </table>
        </div>
    </main>

    <script>
        // Przykładowe dane
        const players = [{ name: "ItzAgg", tier: "HT1", elo: 3200 }, { name: "Carbstuk", tier: "HT2", elo: 2800 }];
        
        function renderTable() {
            const tbody = document.getElementById('playerTableBody');
            tbody.innerHTML = players.map((p, i) => `
                <tr class="border-b border-slate-800/50">
                    <td class="py-4 text-purple-400 font-bold">#${i+1}</td>
                    <td class="py-4">${p.name}</td>
                    <td class="py-4"><span class="tier-ht1">${p.tier}</span></td>
                    <td class="py-4 text-right font-mono font-bold">${p.elo}</td>
                </tr>
            `).join('');
        }

        function switchView(v) { /* Logika przełączania widoków */ }
        
        renderTable();
    </script>
</body>
</html>
