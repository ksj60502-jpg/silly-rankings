<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silly Rankings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');
        body { background-color: #030407; color: #f8fafc; font-family: 'Outfit', sans-serif; }
        .glass { background: rgba(13, 17, 28, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .tier-ht1 { color: #fca5a5; background: #991b1b; } .tier-lt1 { color: #fdba74; background: #c2410c; }
        .tier-ht2 { color: #fde047; background: #b45309; } .tier-lt2 { color: #e4e4e7; background: #52525b; }
        .tier-ht3 { color: #86efac; background: #166534; } .tier-lt3 { color: #6ee7b7; background: #047857; }
        .tier-ht4 { color: #93c5fd; background: #1d4ed8; } .tier-lt4 { color: #bfdbfe; background: #1e40af; }
        .tier-ht5 { color: #d8b4fe; background: #581c87; } .tier-lt5 { color: #c4b5fd; background: #6d28d9; }
    </style>
</head>
<body class="p-4 md:p-10">

    <!-- Baner Discord -->
    <div class="max-w-3xl mx-auto mb-6 glass rounded-2xl p-4 flex flex-wrap items-center justify-center gap-4 text-center border-purple-500/30">
        <span class="bg-purple-600 text-[10px] px-2 py-1 rounded font-black uppercase">Discord</span>
        <p class="text-xs font-medium">Chcesz się znaleźć na tabeli? Wbijaj na serwer DC i bądź sprawdzony!</p>
        <a href="https://discord.gg/ShcxZ4Cv9" target="_blank" class="bg-indigo-600 hover:bg-indigo-500 text-xs font-bold px-4 py-1.5 rounded-lg transition-all">Dołącz teraz</a>
    </div>

    <!-- Tabela -->
    <div class="max-w-3xl mx-auto glass rounded-3xl p-6 md:p-8">
        <h1 class="text-2xl font-black mb-6">Oficjalny Ranking</h1>
        <input type="text" id="search" onkeyup="render()" placeholder="Szukaj gracza..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 mb-6 outline-none focus:border-purple-500">
        
        <table class="w-full text-left">
            <thead><tr class="text-slate-500 text-[10px] uppercase">
                <th class="p-3">#</th><th class="p-3">Gracz</th><th class="p-3">Dywizja</th><th class="p-3 text-right">ELO</th>
            </tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
        
        <button onclick="document.getElementById('admin').classList.toggle('hidden')" class="mt-8 text-[10px] text-slate-600 uppercase font-bold tracking-widest">Panel Admina</button>
    </div>

    <!-- Admin -->
    <div id="admin" class="hidden max-w-3xl mx-auto mt-6 glass rounded-2xl p-6">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <input id="n" placeholder="Nick" class="bg-slate-900 p-2 rounded text-sm">
            <select id="t" class="bg-slate-900 p-2 rounded text-sm">
                <option>HT1</option><option>LT1</option><option>HT2</option><option>LT2</option>
                <option>HT3</option><option>LT3</option><option>HT4</option><option>LT4</option>
                <option>HT5</option><option>LT5</option>
            </select>
            <input id="e" type="number" placeholder="ELO" class="bg-slate-900 p-2 rounded text-sm">
            <button onclick="add()" class="bg-purple-600 rounded text-sm font-bold">Dodaj</button>
        </div>
    </div>

    <script>
        let p = JSON.parse(localStorage.getItem('data')) || [
            {n: "Conor", t: "HT3", e: 2700}, {n: "Mloddy_", t: "LT1", e: 2500},
            {n: "Tchomad", t: "LT2", e: 2400}, {n: "Dymoty", t: "LT3", e: 2100},
            {n: "ximixemx", t: "LT4", e: 1500}, {n: "franczesco4", t: "LT5", e: 900}
        ];

        function render() {
            let q = document.getElementById('search').value.toLowerCase();
            let b = document.getElementById('tableBody');
            b.innerHTML = '';
            p.sort((a,b) => b.e - a.e);
            p.forEach((x, i) => {
                if(x.n.toLowerCase().includes(q)) {
                    b.innerHTML += `<tr class="border-t border-slate-800/50">
                        <td class="p-3 text-purple-400 font-bold">#${i+1}</td>
                        <td class="p-3 font-bold">${x.n}</td>
                        <td class="p-3"><span class="tier-${x.t.toLowerCase()} px-2 py-0.5 rounded text-[10px] font-black">${x.t}</span></td>
                        <td class="p-3 text-right font-mono">${x.e}</td>
                    </tr>`;
                }
            });
            localStorage.setItem('data', JSON.stringify(p));
        }

        function add() {
            p.push({n: document.getElementById('n').value, t: document.getElementById('t').value, e: parseInt(document.getElementById('e').value)});
            render();
        }
        render();
    </script>
</body>
</html>
